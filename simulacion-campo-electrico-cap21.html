<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campo Eléctrico I</title><style>body{margin:0;font-family:Arial,sans-serif;background:#fff8e6;color:#111}header{padding:12px;background:#fff;border-bottom:3px solid #111}h1{margin:0;font-size:clamp(26px,7vw,52px)}.sub{font-weight:bold;color:#0f55aa}.app{display:grid;grid-template-columns:1fr 330px;gap:10px;padding:10px;height:calc(100vh - 95px)}.stage{border:3px solid #111;background:#fff;min-height:420px}canvas{width:100%;height:100%;display:block;touch-action:none;background-image:linear-gradient(rgba(15,85,170,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(15,85,170,.09) 1px,transparent 1px);background-size:32px 32px}.panel{border:3px solid #111;background:#fff;overflow:auto}.sec{padding:12px;border-bottom:2px solid #111}button{border:2px solid #111;background:#ffd33d;font-weight:800;padding:9px;margin:3px}input{width:100%}.card{border:2px solid #111;padding:8px;margin:8px 0}.metric{display:flex;justify-content:space-between;border:2px solid #111;padding:7px;margin:5px 0;font-weight:bold}@media(max-width:850px){.app{display:block;height:auto}.stage{height:62vh}.panel{margin-top:8px}}</style></head><body><header><h1>Campo Eléctrico I</h1><div class="sub">Simulador interactivo compatible con iPhone, Android y PC · Profesor Wong · Om Sai Ram JRW</div></header><div class="app"><section class="stage"><canvas id="cv"></canvas></section><aside class="panel"><div class="sec"><b>Ley de Coulomb:</b> E = kq/r². Arrastra las cargas con el dedo o mouse.</div><div class="sec"><h3>Cargas</h3><div id="list"></div><button id="addp">+ carga</button><button id="addn">− carga</button><button id="del">Quitar</button><button id="reset">Reiniciar</button></div><div class="sec"><label>q prueba (µC)<input id="qt" type="number" value="1" step="0.1"></label><label><input id="vec" type="checkbox" checked> Mostrar vectores</label><label><input id="lin" type="checkbox" checked> Mostrar líneas</label></div><div class="sec"><h3>Resultados</h3><div class="metric"><span>|E|</span><span id="em">0</span></div><div class="metric"><span>Ex</span><span id="ex">0</span></div><div class="metric"><span>Ey</span><span id="ey">0</span></div><div class="metric"><span>|F|</span><span id="fm">0</span></div><div class="metric"><span>Dirección</span><span id="ang">0°</span></div></div></aside></div><script>const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),k=8.9875517923e9,mpp=.01;let dpr=1,drag=null,C=[],T={x:650,y:370,q:1};function resetAll(){C=[{id:1,x:280,y:260,q:4},{id:2,x:520,y:270,q:-3},{id:3,x:400,y:450,q:-2}];T={x:650,y:370,q:+qt.value||1};render();draw()}function resize(){dpr=devicePixelRatio||1;let r=cv.getBoundingClientRect();cv.width=Math.max(320,r.width*dpr);cv.height=Math.max(320,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function dim(){return{w:cv.width/dpr,h:cv.height/dpr}}function field(x,y){let ex=0,ey=0;for(const c of C){let dx=x-c.x,dy=y-c.y,r=Math.max(Math.hypot(dx,dy),20),rm=r*mpp,e=k*c.q*1e-6/(rm*rm);ex+=e*dx/r;ey+=e*dy/r}return{ex,ey,mag:Math.hypot(ex,ey),a:Math.atan2(ey,ex)}}function sci(v,u){return(!isFinite(v)||Math.abs(v)<1e-9?'0':v.toExponential(2).replace('e+','×10^'))+' '+u}function arrow(x1,y1,x2,y2,c,w=2){let a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle=ctx.fillStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-.5),y2-9*Math.sin(a-.5));ctx.lineTo(x2-9*Math.cos(a+.5),y2-9*Math.sin(a+.5));ctx.fill()}function drawCharge(c,t){let r=t?20:25;ctx.fillStyle=t?'#16773a':c.q>=0?'#e43622':'#0f55aa';ctx.beginPath();ctx.arc(c.x,c.y,r,0,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#111';ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t?'t':c.q>=0?'+':'−',c.x,c.y)}function drawVectors(w,h){for(let y=65;y<h-25;y+=64)for(let x=40;x<w-25;x+=64){let e=field(x,y),L=12+Math.min(28,Math.log10(e.mag+1)*3);arrow(x-Math.cos(e.a)*L/2,y-Math.sin(e.a)*L/2,x+Math.cos(e.a)*L/2,y+Math.sin(e.a)*L/2,'rgba(15,85,170,.65)',1.4)}}function trace(x,y,s,col){let D=dim();ctx.strokeStyle=col;ctx.globalAlpha=.42;ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<100;i++){let e=field(x,y),a=e.a+(s<0?Math.PI:0);x+=Math.cos(a)*7;y+=Math.sin(a)*7;ctx.lineTo(x,y);if(x<0||x>D.w||y<0||y>D.h)break}ctx.stroke();ctx.globalAlpha=1}function drawLines(){for(const c of C)for(let i=0;i<14;i++){let a=2*Math.PI*i/14;trace(c.x+Math.cos(a)*24,c.y+Math.sin(a)*24,c.q>=0?1:-1,c.q>=0?'#e43622':'#0f55aa')}}function draw(){let D=dim();ctx.clearRect(0,0,D.w,D.h);if(lin.checked)drawLines();if(vec.checked)drawVectors(D.w,D.h);C.forEach(c=>drawCharge(c));T.q=+qt.value||0;drawCharge(T,true);let e=field(T.x,T.y),L=Math.min(95,18+Math.log10(e.mag+1)*8);arrow(T.x,T.y,T.x+Math.cos(e.a)*L,T.y+Math.sin(e.a)*L,'#16773a',4);let f=Math.abs(T.q*1e-6)*e.mag;em.textContent=sci(e.mag,'N/C');ex.textContent=sci(e.ex,'N/C');ey.textContent=sci(e.ey,'N/C');fm.textContent=sci(f,'N');ang.textContent=((e.a*180/Math.PI+360)%360).toFixed(1)+'°'}function render(){list.innerHTML='';C.forEach(c=>{let div=document.createElement('div');div.className='card';div.innerHTML='<b>Carga '+c.id+': '+c.q.toFixed(1)+' µC</b><input type="range" min="-8" max="8" step="0.1" value="'+c.q+'">';let inp=div.querySelector('input');inp.oninput=()=>{c.q=+inp.value;render();draw()};list.appendChild(div)})}function pos(e){let r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function down(e){e.preventDefault();let p=pos(e);drag=[...C,T].find(c=>Math.hypot(p.x-c.x,p.y-c.y)<35)}function move(e){if(!drag)return;e.preventDefault();let p=pos(e),D=dim();drag.x=Math.max(25,Math.min(D.w-25,p.x));drag.y=Math.max(25,Math.min(D.h-25,p.y));draw()}function up(){drag=null}cv.addEventListener('mousedown',down);addEventListener('mousemove',move);addEventListener('mouseup',up);cv.addEventListener('touchstart',down,{passive:false});addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);addp.onclick=()=>{C.push({id:C.length+1,x:160+Math.random()*250,y:150+Math.random()*250,q:2});render();draw()};addn.onclick=()=>{C.push({id:C.length+1,x:160+Math.random()*250,y:150+Math.random()*250,q:-2});render();draw()};del.onclick=()=>{C.pop();render();draw()};reset.onclick=resetAll;qt.oninput=draw;vec.onchange=draw;lin.onchange=draw;addEventListener('resize',resize);resetAll();setTimeout(resize,100);</script></body></html>
